<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Orblitz</title>
    <script>
      // JavaScript function to handle Unity messages
      // Listen for messages from Unity or other windows
      window.addEventListener('message', async function (event) {
        // Validate the origin if needed for security (replace with your expected origin)
        if (event.origin !== 'https://www.metagg.com') {
          console.warn('Blocked message from untrusted origin:', event.origin);
          return;
        }

        const message = event.data;

        // Process messages of type "gameScore"
        if (message.type === "gameScore") {
          console.log("Score from Unity:", message.score);

          try {
            // Send the data to your server
            const response = await fetch('/api/mini-games/submit-score', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(message),
            });

            // Check for a successful response
            if (!response.ok) {
              console.error('Failed to send game score:', response.status, response.statusText);
            } else {
              console.log('Game score successfully sent to server');
            }
          } catch (error) {
            console.error('Fetch error:', error);
          }
        }
      });

    </script>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width="540" height="960" tabindex="-1" style="width: 540px; height: 960px; background: #231F20"></canvas>
    <script src="Build/ais-ms-mg-test.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/ais-ms-mg-test.data",
        frameworkUrl: "Build/ais-ms-mg-test.framework.js",
        codeUrl: "Build/ais-ms-mg-test.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Astra Interactive Games",
        productName: "Orblitz",
        productVersion: "0.4.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      });
    </script>
  </body>
</html>
